<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Nabung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f5f2eb;
        }
    </style>
</head>
<body class="text-slate-800 font-sans flex flex-col justify-between h-full relative">

    <!-- Header -->
    <header class="bg-[#e6dfd1] p-4 shadow-sm flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-lg font-bold tracking-wide"><i class="fa-solid fa-piggy-bank mr-2"></i> Nabung App</h1>
        <button class="text-lg text-slate-700 focus:outline-none"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col justify-center items-center text-center p-6 space-y-3 overflow-y-auto">
        <div class="bg-[#ded5c4] w-20 h-20 rounded-full flex items-center justify-center text-3xl shadow-inner text-slate-700">
            <i class="fa-solid fa-dollar-sign"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-700">Belum ada target aktif</h2>
        <p class="text-xs text-slate-500 max-w-xs">Buat Goal atau Challenge baru untuk mulai menabung impianmu.</p>
    </main>

    <!-- Floating Action Button (+) -->
    <div class="fixed bottom-20 right-5 z-20">
        <button onclick="togglePopup()" class="bg-[#2c2621] text-[#f5f2eb] w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-xl transition-transform transform active:scale-90 hover:bg-black focus:outline-none">
            <i class="fa-solid fa-plus" id="plus-icon"></i>
        </button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-[#e6dfd1] border-t border-[#d8cfbe] py-3 px-6 flex justify-around items-center text-xs font-medium fixed bottom-0 left-0 right-0 z-30 shadow-lg">
        <button class="flex flex-col items-center text-slate-900 focus:outline-none">
            <i class="fa-solid fa-wallet text-base mb-1"></i>
            <span>Berjalan</span>
        </button>
        <button class="flex flex-col items-center text-slate-400 hover:text-slate-700 focus:outline-none">
            <i class="fa-solid fa-circle-check text-base mb-1"></i>
            <span>Selesai</span>
        </button>
    </nav>

    <!-- Popup Pilihan Tipe Target (Modal) -->
    <div id="target-popup" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden transition-opacity opacity-0 duration-200">
        <div id="popup-content" class="bg-[#f5f2eb] w-full max-w-xs rounded-3xl p-5 shadow-2xl space-y-3 transform scale-95 transition-transform duration-200 border border-[#e2d9cc]">
            
            <h3 class="text-lg font-bold text-slate-800 mb-2">Pilih Tipe Target</h3>

            <!-- Opsi 1: Nabung Biasa -->
            <button onclick="pilihTarget('Nabung')" class="w-full bg-[#f0ebd8] hover:bg-[#e6dfd1] p-3.5 rounded-2xl flex items-center space-x-3 text-left transition active:scale-95 border border-[#e6dfd1]">
                <div class="bg-[#ded5c4] w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 flex-shrink-0">
                    <i class="fa-solid fa-flag"></i>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800">Nabung</div>
                    <div class="text-[11px] text-slate-500">Buat target tabungan biasa</div>
                </div>
            </button>

            <!-- Opsi 2: Nabung Berkala -->
            <button onclick="pilihTarget('Nabung Berkala')" class="w-full bg-[#f0ebd8] hover:bg-[#e6dfd1] p-3.5 rounded-2xl flex items-center space-x-3 text-left transition active:scale-95 border border-[#e6dfd1]">
                <div class="bg-[#ded5c4] w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 flex-shrink-0">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800">Nabung Berkala</div>
                    <div class="text-[11px] text-slate-500">Target dengan setoran rutin</div>
                </div>
            </button>

            <!-- Tombol Batal -->
            <div class="pt-2 flex justify-end">
                <button onclick="togglePopup()" class="px-5 py-2 rounded-xl border border-[#d8cfbe] text-xs font-semibold text-slate-700 hover:bg-[#e6dfd1] active:scale-95 transition">
                    Batal
                </button>
            </div>

        </div>
    </div>

    <!-- Script Interaktif Popup -->
    <script>
        const popup = document.getElementById('target-popup');
        const popupContent = document.getElementById('popup-content');
        const plusIcon = document.getElementById('plus-icon');

        function togglePopup() {
            if (popup.classList.contains('hidden')) {
                // Munculkan popup dengan animasi
                popup.classList.remove('hidden');
                setTimeout(() => {
                    popup.classList.remove('opacity-0');
                    popupContent.classList.remove('scale-95');
                    popupContent.classList.add('scale-100');
                }, 10);
                // Putar ikon plus jadi silang (X)
                plusIcon.classList.remove('fa-plus');
                plusIcon.classList.add('fa-xmark');
            } else {
                // Tutup popup dengan animasi
                popup.classList.add('opacity-0');
                popupContent.classList.remove('scale-100');
                popupContent.classList.add('scale-95');
                setTimeout(() => {
                    popup.classList.add('hidden');
                }, 200);
                // Kembalikan ikon jadi plus
                plusIcon.classList.remove('fa-xmark');
                plusIcon.classList.add('fa-plus');
            }
        }

        function pilihTarget(tipe) {
            alert('Kamu memilih: ' + tipe + '\nForm pengisian target akan kita buat selanjutnya!');
            togglePopup();
        }

        // Tutup popup jika area luar card diklik
        popup.addEventListener('click', function(e) {
            if (e.target === popup) {
                togglePopup();
            }
        });
    </script>
</body>
</html>
