<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#030712] text-white font-sans flex flex-col h-screen justify-between overflow-hidden">

    <!-- TOP HEADER (Menu Kiri, Title Tengah, Tombol Kanan menyusul) -->
    <header class="flex justify-between items-center px-4 py-3 bg-[#030712] border-b border-slate-900 z-10 flex-shrink-0">
        <!-- Kiri: Tombol Menu / Garis Tiga -->
        <button onclick="toggleMenu()" class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-300 hover:text-white transition focus:outline-none">
            <i class="fa-solid fa-bars text-sm"></i>
        </button>

        <!-- Tengah: Title "Home" -->
        <h1 class="text-sm font-bold tracking-wide text-slate-200">Home</h1>

        <!-- Kanan: Placeholder (Nanti ditambahkan belakangan sesuai permintaan) -->
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-400 text-xs">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-400 text-xs relative">
                <i class="fa-solid fa-bell"></i>
                <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-rose-500"></span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-4 pb-24">
        
        <!-- BANNER UTAMA (Gojo Image & Overlay Info) -->
        <div class="relative rounded-3xl overflow-hidden border border-slate-800/80 shadow-2xl bg-[#0b0f24] h-48">
            <!-- Foto Tema Gojo -->
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=80" alt="Gojo Banner" class="w-full h-full object-cover opacity-75">
            <!-- Gradasi Hitam Transparan -->
            <div class="absolute inset-0 bg-gradient-to-t from-[#030712] via-[#030712]/20 to-transparent"></div>
            
            <!-- Teks di dalam Banner (Kiri Bawah & Kanan Bawah) -->
            <div class="absolute bottom-3 left-4 right-4 z-10 flex justify-between items-end">
                <div>
                    <h2 class="text-xs font-extrabold tracking-wide text-white uppercase drop-shadow-md">MBD DHO Project</h2>
                    <p id="current-date" class="text-[10px] text-slate-300 font-medium">Jum, 6 Nov 2026</p>
                </div>
                <div class="px-2.5 py-1 rounded-xl bg-black/50 backdrop-blur-md border border-white/10 text-[10px] font-mono text-white font-bold" id="clock">
                    15:36 WIB
                </div>
            </div>
        </div>

        <!-- CARD PROFIL USER (Otomatis Menyesuaikan Nama Login) -->
        <div class="relative rounded-3xl overflow-hidden border border-slate-800/80 bg-[#0b0f24] shadow-xl p-4 space-y-3">
            <!-- Header warna ungu di atas card -->
            <div class="absolute top-0 left-0 right-0 h-10 bg-gradient-to-r from-purple-900/60 to-indigo-900/40 border-b border-slate-800/50"></div>
            
            <div class="relative z-10 flex items-center justify-between pt-2">
                <div class="flex items-center space-x-3">
                    <!-- Foto Profil Bulat -->
                    <div class="w-12 h-12 rounded-full bg-slate-900 border-2 border-purple-500/50 flex items-center justify-center overflow-hidden shadow-md">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="User Avatar" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <!-- Nama User Dinamis dari Login -->
                        <h3 id="profile-username" class="text-sm font-extrabold text-white tracking-wide">dikaanjay</h3>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
            </div>

            <!-- Badge Status & Tanggal di Bawah Card Profil -->
            <div class="flex items-center space-x-2 pt-1">
                <span class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-bold text-slate-300">FREE</span>
                <span class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-semibold text-slate-400 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> GS · Off
                </span>
                <span id="card-date-badge" class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-semibold text-slate-400 flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar text-[9px]"></i> 06/11/2026
                </span>
            </div>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#090d1e]/95 backdrop-blur-lg border-t border-slate-800/80 px-4 py-2.5 flex justify-around items-center z-20">
        <a href="#" class="flex flex-col items-center text-indigo-400 space-y-1">
            <i class="fa-solid fa-house text-xs"></i>
            <span class="text-[9px] font-bold">Home</span>
        </a>
        <a href="#" onclick="bukaChatAI()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1">
            <i class="fa-solid fa-comments text-xs"></i>
            <span class="text-[9px]">Chat</span>
        </a>
        <a href="#" onclick="bukaUlarTangga()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1">
            <div class="w-10 h-10 -mt-5 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-600/50 border-4 border-[#030712]">
                <i class="fa-solid fa-users text-xs"></i>
            </div>
            <span class="text-[9px]">Group</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1">
            <i class="fa-solid fa-circle-info text-xs"></i>
            <span class="text-[9px]">Info</span>
        </a>
        <a href="#" onclick="toggleMenu()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1">
            <i class="fa-solid fa-toolbox text-xs"></i>
            <span class="text-[9px]">Tools</span>
        </a>
    </nav>

    <!-- SCRIPT UTAMA -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Cek apakah user sudah login
            const loggedUser = localStorage.getItem('mbd_logged_user');
            if (!loggedUser) {
                window.location.href = 'login.html';
                return;
            }

            // Tampilkan nama user sesuai akun yang login
            document.getElementById('profile-username').textContent = loggedUser;

            // Set Tanggal & Jam Realtime
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        function updateDateTime() {
            const now = new Date();
            
            // Format Hari & Tanggal (Contoh: Jum, 6 Nov 2026)
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('id-ID', optionsDate);

            // Format Jam WIB (Contoh: 15:36 WIB)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes} WIB`;

            // Format tanggal card (06/11/2026)
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('card-date-badge').innerHTML = `<i class="fa-regular fa-calendar text-[9px]"></i> ${day}/${month}/${year}`;
        }

        function toggleMenu() {
            alert('Menu Tools / Sidebar');
        }

        function bukaChatAI() {
            alert('Fitur Chat AI');
        }

        function bukaUlarTangga() {
            alert('Fitur Permainan Ular Tangga');
        }
    </script>
</body>
</html>
