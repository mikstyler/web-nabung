<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Nabung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mencegah scroll body yang tidak perlu dan mengunci tinggi layar HP */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f5f2eb;
        }
    </style>
</head>
<body class="text-slate-800 font-sans flex flex-col justify-between h-full">

    <!-- Header -->
    <header class="bg-[#e6dfd1] p-4 shadow-sm flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-lg font-bold tracking-wide"><i class="fa-solid fa-piggy-bank mr-2"></i> Nabung App</h1>
        <button class="text-lg text-slate-700 focus:outline-none"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col justify-center items-center text-center p-6 space-y-3 overflow-y-auto">
        <div class="bg-[#ded5c4] w-20 h-20 rounded-full flex items-center justify-center text-3xl shadow-inner text-slate-700">
            <i class="fa-solid fa-dollar-sign"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-700">Belum ada target aktif</h2>
        <p class="text-xs text-slate-500 max-w-xs">Buat Goal atau Challenge baru untuk mulai menabung impianmu.</p>
    </main>

    <!-- Floating Action Button (+) di atas navigasi -->
    <div class="fixed bottom-20 right-5 z-20">
        <button onclick="alert('Form buat target akan segera hadir!')" class="bg-[#2c2621] text-[#f5f2eb] w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-xl hover:bg-black transition active:scale-95">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- Bottom Navigation Bar (Ditinggikan sedikit z-index-nya agar posisinya di atas badge Netlify) -->
    <nav class="bg-[#e6dfd1] border-t border-[#d8cfbe] py-3 px-6 flex justify-around items-center text-xs font-medium fixed bottom-0 left-0 right-0 z-30 shadow-lg">
        <button class="flex flex-col items-center text-slate-900 focus:outline-none">
            <i class="fa-solid fa-wallet text-base mb-1"></i>
            <span>Berjalan</span>
        </button>
        <button class="flex flex-col items-center text-slate-400 hover:text-slate-700 focus:outline-none">
            <i class="fa-solid fa-circle-check text-base mb-1"></i>
            <span>Selesai</span>
        </button>
    </nav>

</body>
</html>
