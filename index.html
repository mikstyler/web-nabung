<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 40px rgba(168, 85, 247, 0.8); }
        }
        .animate-glow {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        @keyframes modalScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#030712] text-white flex flex-col items-center justify-center min-h-screen p-4 overflow-y-auto relative">

    <!-- HALAMAN UTAMA LOGIN / REGISTER -->
    <div id="auth-container" class="w-full max-w-sm flex flex-col items-center space-y-6 my-auto transition-opacity duration-300">
        
        <!-- Foto Profil Gojo & Judul MBD DHO -->
        <div class="flex flex-col items-center space-y-3">
            <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-purple-500 to-indigo-600 shadow-xl shadow-purple-900/30">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=80" alt="Gojo Profile" class="w-full h-full rounded-full object-cover">
            </div>
            <div class="text-center">
                <h1 class="text-base font-black tracking-widest text-white uppercase">MBD DHO</h1>
                <p class="text-[11px] text-purple-400 font-semibold tracking-wider">MENABUNG BERSAMA DHO</p>
            </div>
        </div>

        <!-- Card Box Form -->
        <div class="w-full bg-[#0b0f24]/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-5">
            <div class="text-center space-y-1">
                <div class="w-8 h-1 bg-purple-500 mx-auto rounded-full mb-2"></div>
                <h2 id="form-title" class="text-sm font-extrabold tracking-wider text-slate-200">Login</h2>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Username</label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-user absolute left-3.5 text-slate-500 text-xs"></i>
                        <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3.5 py-3 pl-10 text-xs focus:outline-none focus:border-purple-500 text-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Password</label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock absolute left-3.5 text-slate-500 text-xs"></i>
                        <input type="password" id="password" required placeholder="Masukkan password" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3.5 py-3 pl-10 pr-10 text-xs focus:outline-none focus:border-purple-500 text-white transition">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 text-slate-500 hover:text-white text-xs focus:outline-none">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="simpan-login-box" class="flex items-center justify-between pt-1">
                    <span class="text-[11px] text-slate-400">Simpan login</span>
                    <input type="checkbox" class="w-4 h-4 accent-purple-600 rounded bg-[#030712] border-slate-800">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 active:scale-95 text-white font-bold text-xs shadow-lg shadow-purple-600/30 transition-all">
                    Login →
                </button>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-4 text-[10px] text-slate-500 uppercase">atau</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <button type="button" onclick="switchMode()" id="switch-btn" class="w-full py-3 rounded-xl bg-[#030712] border border-slate-800 hover:bg-slate-900 active:scale-95 text-slate-300 font-bold text-xs transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus text-[11px]"></i> Daftar Akun Baru
            </button>
        </div>

        <div class="text-center space-y-1">
            <a href="#" class="text-[10px] text-purple-400 hover:underline">Syarat & Ketentuan</a>
            <p class="text-[10px] text-slate-500">MBD DHO • Vercel Ready</p>
        </div>
    </div>


    <!-- CUSTOM POP-UP NOTIFIKASI (MENGGANTIKAN ALERT POLOSAN) -->
    <div id="custom-alert" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#0b0f24] border border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl animate-modal">
            <!-- Ikon Status -->
            <div id="alert-icon-container" class="w-14 h-14 rounded-full bg-purple-500/20 border border-purple-500/40 text-purple-400 flex items-center justify-center text-xl mx-auto shadow-lg shadow-purple-900/30">
                <i id="alert-icon" class="fa-solid fa-circle-info"></i>
            </div>
            
            <div class="space-y-1">
                <h3 id="alert-title" class="text-sm font-extrabold text-white">Notifikasi MBD</h3>
                <p id="alert-message" class="text-[11px] text-slate-400 leading-relaxed">Pesan informasi sistem di sini.</p>
            </div>

            <!-- Tombol "Oke" Kustom -->
            <button onclick="tutupCustomAlert()" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 active:scale-95 text-white font-bold text-xs shadow-lg shadow-purple-600/30 transition-all">
                Oke
            </button>
        </div>
    </div>


    <!-- ANIMASI WELCOME BACK (SPLASH SCREEN) -->
    <div id="welcome-screen" class="fixed inset-0 bg-[#030712] z-50 flex flex-col justify-between items-center p-6 hidden opacity-0 transition-opacity duration-500">
        <div class="w-full flex justify-end">
            <button onclick="lanjutKeDashboard()" class="px-4 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-[11px] font-bold text-slate-300 hover:bg-slate-800 active:scale-95 transition">
                Skip
            </button>
        </div>

        <div class="flex flex-col items-center space-y-5 text-center my-auto">
            <div class="w-20 h-20 rounded-full bg-purple-600 flex items-center justify-center text-white text-2xl shadow-2xl animate-glow">
                <i class="fa-solid fa-check"></i>
            </div>

            <div class="space-y-1.5">
                <p class="text-[10px] tracking-widest text-purple-400 font-bold uppercase">SUCCESS LOGIN</p>
                <h2 class="text-xl font-extrabold tracking-wide text-white uppercase">WELCOME BACK</h2>
            </div>

            <div id="welcome-username" class="px-4 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 shadow-inner">
                dho
            </div>
        </div>

        <div class="text-[10px] text-slate-500 tracking-wider">
            Session secured • MBD DHO
        </div>
    </div>


    <!-- SCRIPT UTAMA -->
    <script>
        let isLoginMode = true;
        let alertCallback = null;

        function showCustomAlert(title, message, type = 'success', callback = null) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            alertCallback = callback;

            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');

            if (type === 'success') {
                iconContainer.className = "w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center text-xl mx-auto shadow-lg shadow-emerald-900/30";
                icon.className = "fa-solid fa-circle-check";
            } else {
                iconContainer.className = "w-14 h-14 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-400 flex items-center justify-center text-xl mx-auto shadow-lg shadow-rose-900/30";
                icon.className = "fa-solid fa-triangle-exclamation";
            }

            const modal = document.getElementById('custom-alert');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function tutupCustomAlert() {
            const modal = document.getElementById('custom-alert');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (alertCallback) {
                    alertCallback();
                    alertCallback = null;
                }
            }, 300);
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = "fa-solid fa-eye-slash";
            } else {
                passInput.type = 'password';
                eyeIcon.className = "fa-solid fa-eye";
            }
        }

        function switchMode() {
            isLoginMode = !isLoginMode;
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const switchBtn = document.getElementById('switch-btn');
            const simpanBox = document.getElementById('simpan-login-box');

            if (isLoginMode) {
                formTitle.textContent = "Login";
                submitBtn.textContent = "Login →";
                switchBtn.innerHTML = `<i class="fa-solid fa-user-plus text-[11px]"></i> Daftar Akun Baru`;
                simpanBox.classList.remove('hidden');
            } else {
                formTitle.textContent = "Register";
                submitBtn.textContent = "Daftar →";
                switchBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket text-[11px]"></i> Sudah punya akun? Login`;
                simpanBox.classList.add('hidden');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (isLoginMode) {
                        localStorage.setItem('mbd_logged_user', data.user.username);
                        tampilkanWelcomeScreen(data.user.username);
                    } else {
                        showCustomAlert("Registrasi Berhasil", data.message, "success", () => {
                            switchMode();
                            document.getElementById('auth-form').reset();
                        });
                    }
                } else {
                    showCustomAlert("Gagal", data.message, "error");
                }
            } catch (err) {
                showCustomAlert("Kesalahan Server", "Gagal terhubung ke database server Vercel.", "error");
            }
        }

        function tampilkanWelcomeScreen(username) {
            document.getElementById('welcome-username').textContent = username;
            const authContainer = document.getElementById('auth-container');
            const welcomeScreen = document.getElementById('welcome-screen');

            authContainer.classList.add('opacity-0');
            setTimeout(() => {
                authContainer.classList.add('hidden');
                welcomeScreen.classList.remove('hidden');
                setTimeout(() => {
                    welcomeScreen.classList.remove('opacity-0');
                }, 50);
            }, 300);

            setTimeout(() => {
                lanjutKeDashboard();
            }, 2500);
        }

        function lanjutKeDashboard() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
