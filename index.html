<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes modalScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body id="main-body" class="bg-[#030712] text-white font-sans flex flex-col h-screen justify-between overflow-hidden relative transition-colors duration-300">

    <!-- TOP HEADER -->
    <header id="main-header" class="flex justify-between items-center px-4 py-3 bg-[#030712] border-b border-slate-900 z-10 flex-shrink-0 transition-colors duration-300">
        <!-- Tombol Titik Tiga -->
        <button onclick="toggleSidebar()" class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition-all duration-150 focus:outline-none shadow-md">
            <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
        </button>

        <!-- Title Home -->
        <h1 class="text-sm font-bold tracking-wide text-slate-200">Home</h1>

        <!-- Tombol Profil & Bell di Pojok Kanan Atas -->
        <div class="flex items-center space-x-2">
            <button onclick="window.location.href='profile.html'" class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-400 hover:text-white active:scale-90 transition-all duration-150">
                <i class="fa-solid fa-user text-xs"></i>
            </button>
            <button class="w-9 h-9 rounded-xl bg-[#0b0f24] border border-slate-800/80 flex items-center justify-center text-slate-400 hover:text-white active:scale-90 transition-all duration-150 relative">
                <i class="fa-solid fa-bell text-xs"></i>
                <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-rose-500"></span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-4 pb-24">
        
        <!-- BANNER UTAMA -->
        <div class="relative rounded-3xl overflow-hidden border border-slate-800/80 shadow-2xl bg-[#0b0f24] h-48 group">
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=80" alt="Gojo Banner" class="w-full h-full object-cover opacity-75 group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#030712] via-[#030712]/20 to-transparent"></div>
            
            <div class="absolute bottom-3 left-4 right-4 z-10 flex justify-between items-end">
                <div>
                    <h2 class="text-xs font-extrabold tracking-wide text-white uppercase drop-shadow-md">MBD DHO Project</h2>
                    <p id="current-date" class="text-[10px] text-slate-300 font-medium">Jum, 6 Nov 2026</p>
                </div>
                <div class="px-2.5 py-1 rounded-xl bg-black/50 backdrop-blur-md border border-white/10 text-[10px] font-mono text-white font-bold" id="clock">
                    15:36 WIB
                </div>
            </div>
        </div>

        <!-- CARD PROFIL USER -->
        <div onclick="window.location.href='profile.html'" class="relative rounded-3xl overflow-hidden border border-slate-800/80 bg-[#0b0f24] shadow-xl p-4 space-y-3 active:scale-[0.98] transition-all duration-150 cursor-pointer">
            <div class="absolute top-0 left-0 right-0 h-10 bg-gradient-to-r from-purple-900/60 to-indigo-900/40 border-b border-slate-800/50"></div>
            
            <div class="relative z-10 flex items-center justify-between pt-2">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-full bg-slate-900 border-2 border-purple-500/50 flex items-center justify-center overflow-hidden shadow-md">
                        <img id="home-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="User Avatar" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 id="profile-username" class="text-sm font-extrabold text-white tracking-wide">dikaanjay</h3>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
            </div>

            <div class="flex items-center space-x-2 pt-1">
                <span class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-bold text-slate-300">FREE</span>
                <span class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-semibold text-slate-400 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> GS · Off
                </span>
                <span id="card-date-badge" class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-[10px] font-semibold text-slate-400 flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar text-[9px]"></i> 06/11/2026
                </span>
            </div>
        </div>

    </main>

    <!-- SIDEBAR MENU -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity opacity-0" onclick="toggleSidebar()"></div>
    <div id="sidebar-menu" class="fixed top-0 left-0 bottom-0 w-72 bg-[#090d1e] border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-5 shadow-2xl">
        <div class="space-y-6">
            <div class="flex items-center space-x-3 pb-4 border-b border-slate-800/80">
                <div class="w-10 h-10 rounded-full bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-400 font-bold text-sm" id="sidebar-initial">
                    D
                </div>
                <div>
                    <h4 id="sidebar-username" class="text-xs font-extrabold text-white">dikaanjay</h4>
                    <span class="text-[10px] text-purple-400 font-semibold">Active Session</span>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Utama</p>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-purple-600/10 border border-purple-500/30 text-purple-300 text-xs font-bold active:scale-95 transition-all">
                        <i class="fa-solid fa-house w-4"></i>
                        <span>Home</span>
                    </a>
                </div>

                <div>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Chat</p>
                    <a href="#" onclick="bukaChatGlobal()" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white active:scale-95 text-xs font-semibold transition-all">
                        <i class="fa-solid fa-comments w-4 text-indigo-400"></i>
                        <span>Chat Global</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800/80">
            <button onclick="bukaModalLogout()" class="w-full flex items-center justify-center space-x-2 py-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 active:scale-95 text-xs font-bold transition-all">
                <i class="fa-solid fa-power-off"></i>
                <span>Logout</span>
            </button>
            <p class="text-[9px] text-center text-slate-500 mt-3">MBD DHO v1.0</p>
        </div>
    </div>

    <!-- MODAL LOGOUT -->
    <div id="logout-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#0b0f24] border border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl animate-modal">
            <div class="w-14 h-14 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-400 flex items-center justify-center text-xl mx-auto shadow-lg shadow-rose-900/30">
                <i class="fa-solid fa-power-off"></i>
            </div>
            <div class="space-y-1">
                <h3 class="text-sm font-extrabold text-white">Konfirmasi Logout</h3>
                <p class="text-[11px] text-slate-400">Apakah kamu yakin ingin keluar dari akun ini?</p>
            </div>
            <div class="flex items-center gap-2 pt-2">
                <button onclick="tutupModalLogout()" class="flex-1 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 active:scale-95 text-xs font-bold transition-all">
                    Batal
                </button>
                <button onclick="eksekusiLogout()" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white active:scale-95 text-xs font-bold shadow-lg shadow-rose-600/30 transition-all">
                    Ya, Keluar
                </button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-[#090d1e]/95 backdrop-blur-lg border-t border-slate-800/80 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300">
        <a href="#" class="flex flex-col items-center text-indigo-400 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-house text-xs"></i>
            <span class="text-[9px] font-bold">Home</span>
        </a>
        <a href="#" onclick="bukaChatGlobal()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-comments text-xs"></i>
            <span class="text-[9px]">Chat</span>
        </a>
        <a href="#" onclick="bukaUlarTangga()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1 active:scale-95 transition-transform">
            <div class="w-10 h-10 -mt-5 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-600/50 border-4 border-[#030712]">
                <i class="fa-solid fa-users text-xs"></i>
            </div>
            <span class="text-[9px]">Group</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-circle-info text-xs"></i>
            <span class="text-[9px]">Info</span>
        </a>
        <a href="#" onclick="toggleSidebar()" class="flex flex-col items-center text-slate-500 hover:text-slate-300 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            <span class="text-[9px]">Tools</span>
        </a>
    </nav>

    <!-- SCRIPT UTAMA WITH THEME & AVATAR SYNC -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loggedUser = localStorage.getItem('mbd_logged_user');
            if (!loggedUser) {
                window.location.href = 'login.html';
                return;
            }

            // Sync Nama Username
            document.getElementById('profile-username').textContent = loggedUser;
            document.getElementById('sidebar-username').textContent = loggedUser;
            document.getElementById('sidebar-initial').textContent = loggedUser.charAt(0).toUpperCase();

            // Sync Foto Avatar dari LocalStorage
            const savedAvatar = localStorage.getItem('mbd_user_avatar_' + loggedUser);
            if (savedAvatar) {
                document.getElementById('home-user-avatar').src = savedAvatar;
            }

            // Sync Tema Aplikasi (Night/Day) dari LocalStorage
            const savedTheme = localStorage.getItem('mbd_theme') || 'night';
            applyTheme(savedTheme);

            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        function applyTheme(mode) {
            const body = document.getElementById('main-body');
            const header = document.getElementById('main-header');
            const bottomNav = document.getElementById('bottom-nav');

            if (mode === 'day') {
                body.className = "bg-slate-100 text-slate-900 font-sans flex flex-col h-screen justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-white border-b border-slate-200 z-10 flex-shrink-0 transition-colors duration-300";
                bottomNav.className = "fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-slate-200 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300";
            } else {
                body.className = "bg-[#030712] text-white font-sans flex flex-col h-screen justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-[#030712] border-b border-slate-900 z-10 flex-shrink-0 transition-colors duration-300";
                bottomNav.className = "fixed bottom-0 left-0 right-0 bg-[#090d1e]/95 backdrop-blur-lg border-t border-slate-800/80 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300";
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function bukaModalLogout() {
            toggleSidebar();
            const modal = document.getElementById('logout-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function tutupModalLogout() {
            const modal = document.getElementById('logout-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function eksekusiLogout() {
            const mainBody = document.getElementById('main-body');
            mainBody.classList.add('opacity-0');
            
            setTimeout(() => {
                localStorage.removeItem('mbd_logged_user');
                window.location.href = 'login.html';
            }, 400);
        }

        function bukaChatGlobal() {
            alert('Fitur Chat Global akan segera diaktifkan!');
        }

        function bukaUlarTangga() {
            alert('Fitur Permainan Ular Tangga!');
        }

        function updateDateTime() {
            const now = new Date();
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('id-ID', optionsDate);

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes} WIB`;

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('card-date-badge').innerHTML = `<i class="fa-regular fa-calendar text-[9px]"></i> ${day}/${month}/${year}`;
        }
    </script>
</body>
</html>
