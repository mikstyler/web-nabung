<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Deposit Saldo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; opacity: 0; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .red-glow { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
        @keyframes modalScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal { animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative">

    <!-- HEADER -->
    <header class="flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0">
        <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all red-glow">
            <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="text-center">
            <h1 class="text-sm font-bold tracking-wide text-rose-100">Deposit Saldo</h1>
            <p class="text-[9px] text-red-400 font-medium">● QRIS Dynamic Auto-Nominal</p>
        </div>
        <div class="w-9"></div>
    </header>

    <!-- CONTENT UTAMA -->
    <main class="flex-grow p-4 overflow-y-auto space-y-4 no-scrollbar">
        
        <!-- INFO SALDO SAAT INI -->
        <div class="p-4 rounded-3xl bg-gradient-to-r from-red-950/50 to-[#14060a] border border-red-600/40 flex items-center justify-between red-glow">
            <div class="space-y-0.5">
                <span class="text-[10px] font-bold text-rose-300/80 uppercase tracking-wider">Dompet Saldo Anda</span>
                <h2 id="user-current-saldo" class="text-lg font-extrabold text-white font-mono">Rp 0</h2>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-red-600/20 border border-red-500/40 flex items-center justify-center text-red-400">
                <i class="fa-solid fa-wallet text-sm"></i>
            </div>
        </div>

        <!-- FORM INPUT NOMINAL -->
        <div class="p-4 rounded-3xl bg-[#14060a] border border-rose-900/50 space-y-4 shadow-xl">
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-rose-300">Masukkan Nominal Deposit (Rp)</label>
                <input type="number" id="input-nominal" placeholder="Contoh: 10000" class="w-full bg-[#090305] border border-rose-900/50 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-red-500 font-mono transition">
            </div>

            <!-- PILIHAN NOMINAL CEPAT -->
            <div class="space-y-1.5">
                <span class="text-[10px] font-bold text-rose-400/70 uppercase">Pilihan Nominal Cepat</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="pilihNominal(2000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 2.000</button>
                    <button onclick="pilihNominal(5000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 5.000</button>
                    <button onclick="pilihNominal(10000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 10.000</button>
                    <button onclick="pilihNominal(15000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 15.000</button>
                    <button onclick="pilihNominal(25000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 25.000</button>
                    <button onclick="pilihNominal(50000)" class="py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-200 hover:border-red-500 text-xs font-mono font-bold active:scale-95 transition">Rp 50.000</button>
                </div>
            </div>

            <button onclick="buatTagihanQRIS()" id="btn-buat" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 hover:opacity-90 active:scale-95 text-white font-extrabold text-xs shadow-lg red-glow transition-all">
                Buat QRIS Otomatis
            </button>
        </div>

        <!-- AREA INVOICE & QRIS DINAMIS -->
        <div id="qris-card" class="hidden p-5 rounded-3xl bg-[#14060a] border border-red-600/60 text-center space-y-4 shadow-2xl red-glow animate-modal">
            <div class="space-y-1">
                <h3 class="text-xs font-extrabold text-white">QRIS SEMBAKO ERNY, Air</h3>
                <p class="text-[10px] text-rose-300">Scan untuk bayar (Nominal otomatis terkunci)</p>
            </div>

            <!-- DETAIL INVOICE -->
            <div class="bg-[#090305] p-3 rounded-2xl border border-rose-900/50 text-left space-y-2 text-[11px]">
                <div class="flex justify-between">
                    <span class="text-rose-400">Total Tagihan:</span>
                    <span id="inv-nominal" class="font-bold font-mono text-emerald-400">Rp 0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-rose-400">Waktu Dibuat:</span>
                    <span id="inv-tanggal" class="font-medium text-white">--</span>
                </div>
                <div class="flex justify-between border-t border-rose-950 pt-2">
                    <span class="text-amber-400 font-bold">Masa Berlaku:</span>
                    <span id="inv-timer" class="font-extrabold font-mono text-amber-400">10:00</span>
                </div>
            </div>

            <!-- GAMBAR QRIS DINAMIS HASIL API -->
            <div class="w-48 h-48 bg-white p-2 rounded-2xl mx-auto border-2 border-red-500 shadow-xl flex items-center justify-center">
                <img id="qris-image-dynamic" src="" alt="QRIS Dinamis" class="w-full h-full object-contain rounded-lg">
            </div>

            <!-- STATUS -->
            <div class="space-y-2">
                <p id="status-teks" class="text-[11px] text-amber-400 font-semibold animate-pulse">Menunggu Pembayaran Real-time...</p>
                <button onclick="batalkanTagihan()" class="w-full py-2.5 rounded-xl bg-rose-950/60 border border-red-500/40 text-red-300 font-bold text-xs active:scale-95 transition">
                    Batalkan Tagihan
                </button>
            </div>
        </div>

    </main>

    <!-- SCRIPT -->
    <script>
        let currentUser = "";
        let finalNominal = 0;
        let timerInterval = null;
        let webhookChecker = null;
        let baselineSaldo = 0;

        document.addEventListener("DOMContentLoaded", () => {
            currentUser = localStorage.getItem('mbd_logged_user');
            if (!currentUser) { window.location.href = 'login.html'; return; }
            baselineSaldo = muatSaldo();
        });

        function muatSaldo() {
            const saldo = parseInt(localStorage.getItem('mbd_saldo_' + currentUser) || '0');
            document.getElementById('user-current-saldo').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
            return saldo;
        }

        function pilihNominal(nilai) {
            document.getElementById('input-nominal').value = nilai;
        }

        async function buatTagihanQRIS() {
            const input = document.getElementById('input-nominal');
            const nominal = parseInt(input.value);

            if (!nominal || nominal < 2000) {
                alert("Minimal deposit adalah Rp 2.000!");
                return;
            }

            finalNominal = nominal;
            const btn = document.getElementById('btn-buat');
            btn.textContent = "Memproses QRIS...";
            btn.disabled = true;

            try {
                // Panggil API backend Vercel untuk generate QRIS ber-nominal
                const response = await fetch('/api/generate-qris', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nominal: nominal })
                });

                const data = await response.json();
                if (data.success) {
                    // Set Tanggal Pembuatan
                    const sekarang = new Date();
                    const waktuStr = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    document.getElementById('inv-nominal').textContent = 'Rp ' + nominal.toLocaleString('id-ID');
                    document.getElementById('inv-tanggal').textContent = waktuStr;
                    document.getElementById('qris-image-dynamic').src = data.qrCodeUrl;

                    // Tampilkan card QRIS
                    document.getElementById('qris-card').classList.remove('hidden');
                    document.getElementById('qris-card').scrollIntoView({ behavior: 'smooth' });

                    // Mulai Countdown 10 Menit (600 detik)
                    mulaiCountdown(600);

                    // Pantau webhook masuk
                    baselineSaldo = muatSaldo();
                    if (webhookChecker) clearInterval(webhookChecker);
                    webhookChecker = setInterval(pantauWebhookMasuk, 3000);
                } else {
                    alert("Gagal membuat QRIS: " + data.error);
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi ke server API.");
            } finally {
                btn.textContent = "Buat QRIS Otomatis";
                btn.disabled = false;
            }
        }

        function mulaiCountdown(durasiDetik) {
            if (timerInterval) clearInterval(timerInterval);
            let sisaWaktu = durasiDetik;

            timerInterval = setInterval(() => {
                let menit = Math.floor(sisaWaktu / 60);
                let detik = sisaWaktu % 60;

                document.getElementById('inv-timer').textContent = 
                    String(menit).padStart(2, '0') + ':' + String(detik).padStart(2, '0');

                if (sisaWaktu <= 0) {
                    clearInterval(timerInterval);
                    expiredTagihan();
                }
                sisaWaktu--;
            }, 1000);
        }

        function pantauWebhookMasuk() {
            const saldoSekarang = muatSaldo();
            if (saldoSekarang > baselineSaldo) {
                clearInterval(timerInterval);
                clearInterval(webhookChecker);

                document.getElementById('status-teks').textContent = "✅ Pembayaran Sukses! Saldo telah masuk otomatis.";
                document.getElementById('status-teks').className = "text-[11px] text-emerald-400 font-bold";
                
                setTimeout(() => {
                    document.getElementById('qris-card').classList.add('hidden');
                    document.getElementById('input-nominal').value = "";
                }, 4000);
            }
        }

        function expiredTagihan() {
            if (webhookChecker) clearInterval(webhookChecker);

            document.getElementById('status-teks').textContent = "❌ Waktu Habis! QRIS telah kedaluwarsa.";
            document.getElementById('status-teks').className = "text-[11px] text-rose-500 font-bold";

            setTimeout(() => {
                document.getElementById('qris-card').classList.add('hidden');
                document.getElementById('input-nominal').value = "";
            }, 3000);
        }

        function batalkanTagihan() {
            if (timerInterval) clearInterval(timerInterval);
            if (webhookChecker) clearInterval(webhookChecker);

            document.getElementById('qris-card').classList.add('hidden');
            document.getElementById('input-nominal').value = "";
        }
    </script>
</body>
</html>
