<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Daftar Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .red-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
        @keyframes modalScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal { animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body id="page-body" class="bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300">

    <!-- HEADER -->
    <header id="page-header" class="flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0 transition-colors duration-300">
        <button onclick="window.location.href='index.html'" id="back-btn" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="text-center">
            <h1 class="text-sm font-bold tracking-wide text-rose-100">Chat Pribadi</h1>
            <p class="text-[9px] text-red-400 font-medium">Daftar Percakapan</p>
        </div>
        <button onclick="tampilkanInfoCustom()" id="info-btn" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-info text-xs text-red-400"></i>
        </button>
    </header>

    <!-- LIST CHAT CONTAINER -->
    <main id="chat-list-container" class="flex-grow p-4 overflow-y-auto space-y-3 no-scrollbar">
        <!-- List akan dimuat via JS -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-[#100407]/95 backdrop-blur-lg border-t border-rose-950/60 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300">
        <a href="index.html" class="flex flex-col items-center text-rose-400/60 hover:text-rose-200 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-house text-xs"></i>
            <span class="text-[9px]">Home</span>
        </a>
        <a href="chatlist.html" class="flex flex-col items-center text-red-500 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-comments text-xs"></i>
            <span class="text-[9px] font-bold">Chat</span>
        </a>
        <a href="index.html" class="flex flex-col items-center text-rose-400/60 hover:text-rose-200 space-y-1 active:scale-95 transition-transform">
            <div class="w-10 h-10 -mt-5 bg-gradient-to-r from-red-600 to-rose-600 rounded-full flex items-center justify-center text-white shadow-lg red-glow border-4 border-[#090305]">
                <i class="fa-solid fa-users text-xs"></i>
            </div>
            <span class="text-[9px]">Group</span>
        </a>
        <a href="index.html" class="flex flex-col items-center text-rose-400/60 hover:text-rose-200 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-circle-info text-xs"></i>
            <span class="text-[9px]">Info</span>
        </a>
        <a href="index.html" class="flex flex-col items-center text-rose-400/60 hover:text-rose-200 space-y-1 active:scale-90 transition-transform">
            <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            <span class="text-[9px]">Tools</span>
        </a>
    </nav>

    <!-- CUSTOM MODAL -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div id="modal-box" class="bg-[#14060a] border border-red-600/50 rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl red-glow animate-modal">
            <div class="w-14 h-14 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 flex items-center justify-center text-xl mx-auto shadow-lg">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <div class="space-y-1">
                <h3 id="modal-title" class="text-sm font-extrabold text-white">Informasi Chat</h3>
                <p id="modal-message" class="text-[11px] text-rose-200/80 leading-relaxed">Pesan sistem...</p>
            </div>
            <button onclick="tutupCustomModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:opacity-90 active:scale-95 text-white font-bold text-xs shadow-lg red-glow transition-all">
                Oke
            </button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentUser = localStorage.getItem('mbd_logged_user');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const savedTheme = localStorage.getItem('mbd_theme') || 'red';
            applyTheme(savedTheme);
            loadChatList(currentUser);
        });

        function applyTheme(mode) {
            const body = document.getElementById('page-body');
            const header = document.getElementById('page-header');
            const bottomNav = document.getElementById('bottom-nav');
            const modalBox = document.getElementById('modal-box');
            const backBtn = document.getElementById('back-btn');
            const infoBtn = document.getElementById('info-btn');

            if (mode === 'day') {
                body.className = "bg-slate-100 text-slate-900 font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-white border-b border-slate-200 z-10 flex-shrink-0 transition-colors duration-300";
                bottomNav.className = "fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-slate-200 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300";
                modalBox.className = "bg-white border border-slate-200 rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl animate-modal text-slate-900";
                backBtn.className = "w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-90 transition-all";
                infoBtn.className = "w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-90 transition-all";
            } else {
                body.className = "bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0 transition-colors duration-300";
                bottomNav.className = "fixed bottom-0 left-0 right-0 bg-[#100407]/95 backdrop-blur-lg border-t border-rose-950/60 px-4 py-2.5 flex justify-around items-center z-20 transition-colors duration-300";
                modalBox.className = "bg-[#14060a] border border-red-600/50 rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl red-glow animate-modal";
                backBtn.className = "w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all";
                infoBtn.className = "w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all";
            }
        }

        function loadChatList(currentUser) {
            const container = document.getElementById('chat-list-container');
            const chatList = JSON.parse(localStorage.getItem(`mbd_private_chats_${currentUser}`) || '[]');
            const savedTheme = localStorage.getItem('mbd_theme') || 'red';

            if (chatList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 space-y-3">
                        <div class="w-16 h-16 rounded-full ${savedTheme === 'day' ? 'bg-slate-200 border-slate-300 text-slate-400' : 'bg-[#14060a] border-rose-900/40 text-rose-400'} border flex items-center justify-center text-xl mx-auto shadow-md">
                            <i class="fa-regular fa-comment-dots"></i>
                        </div>
                        <h3 class="text-xs font-bold ${savedTheme === 'day' ? 'text-slate-700' : 'text-slate-300'}">Belum ada percakapan</h3>
                        <p class="text-[10px] text-slate-500 max-w-xs mx-auto">Buka Global Chat, klik profil seseorang, lalu pilih "Chat Pribadi" untuk memulai percakapan.</p>
                    </div>
                `;
                return;
            }

            let html = "";
            chatList.forEach(item => {
                const storageKey = `mbd_dm_${[currentUser, item.targetUser].sort().join('_')}`;
                const messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const lastMsg = messages.length > 0 ? messages[messages.length - 1].message : 'Ketuk untuk mulai mengobrol...';
                const timeStr = messages.length > 0 ? messages[messages.length - 1].time : '';

                const cardClass = savedTheme === 'day' 
                    ? 'bg-white border-slate-200 text-slate-900 shadow-md' 
                    : 'bg-[#14060a] border-rose-900/40 text-white shadow-lg';

                html += `
                    <div onclick="bukaRuangChat('${item.targetUser}')" class="flex items-center justify-between p-3.5 rounded-2xl border ${cardClass} active:scale-[0.98] transition-all cursor-pointer">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-full ${savedTheme === 'day' ? 'bg-slate-100 border-slate-300 text-red-600' : 'bg-black border-red-600/60 text-red-400'} border-2 flex items-center justify-center font-extrabold text-sm uppercase shadow-sm">
                                ${item.targetUser.charAt(0)}
                            </div>
                            <div>
                                <h4 class="text-xs font-extrabold">@${item.targetUser}</h4>
                                <p class="text-[10px] text-slate-400 truncate max-w-[180px] pt-0.5">${escapeHtml(lastMsg)}</p>
                            </div>
                        </div>
                        <span class="text-[9px] text-slate-500 font-medium">${timeStr}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function bukaRuangChat(target) {
            window.location.href = `privatechat.html?target=${encodeURIComponent(target)}`;
        }

        function tampilkanInfoCustom() {
            document.getElementById('modal-title').textContent = "Panduan Chat Pribadi";
            document.getElementById('modal-message').textContent = "Daftar ini akan terisi otomatis setelah kamu mengklik profil seseorang di Global Chat dan memulai obrolan privat.";
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function tutupCustomModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
