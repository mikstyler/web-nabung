<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Chat Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .red-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
    </style>
</head>
<body id="page-body" class="bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300">

    <!-- HEADER PRIVATE CHAT -->
    <header id="page-header" class="flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0 transition-colors duration-300">
        <button onclick="window.location.href='chatlist.html'" id="back-btn" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="text-center">
            <h1 id="target-username-title" class="text-sm font-bold tracking-wide text-rose-100">Chat Pribadi</h1>
            <p class="text-[9px] text-red-400 font-medium">● Secure Direct Message</p>
        </div>
        <div class="w-9"></div>
    </header>

    <!-- ROOM PESAN PRIVAT -->
    <main id="private-container" class="flex-grow p-4 overflow-y-auto space-y-4 no-scrollbar">
        <div class="text-center py-10 text-slate-500 text-xs">Memuat pesan...</div>
    </main>

    <!-- FORM INPUT PRIVAT -->
    <footer id="page-footer" class="p-3 bg-[#100407] border-t border-rose-950/60 flex-shrink-0 z-20 transition-colors duration-300">
        <form onsubmit="kirimPesanPrivat(event)" class="flex items-center space-x-2">
            <input type="text" id="privat-input" required placeholder="Tulis pesan pribadi..." class="flex-grow bg-[#090305] border border-rose-900/40 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-red-500 text-white transition">
            <button type="submit" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 flex items-center justify-center text-white active:scale-90 transition-all shadow-lg red-glow flex-shrink-0">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- SCRIPT -->
    <script>
        let currentUser = "";
        let targetUser = "";

        document.addEventListener("DOMContentLoaded", () => {
            currentUser = localStorage.getItem('mbd_logged_user');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            targetUser = urlParams.get('target');
            if (!targetUser) {
                window.location.href = 'chatlist.html';
                return;
            }

            const savedTheme = localStorage.getItem('mbd_theme') || 'red';
            applyTheme(savedTheme);

            document.getElementById('target-username-title').textContent = `@${targetUser}`;
            
            tambahKeDaftarChat(currentUser, targetUser);
            tambahKeDaftarChat(targetUser, currentUser);

            loadPrivateMessages();
            setInterval(loadPrivateMessages, 2500);
        });

        function applyTheme(mode) {
            const body = document.getElementById('page-body');
            const header = document.getElementById('page-header');
            const footer = document.getElementById('page-footer');
            const backBtn = document.getElementById('back-btn');

            if (mode === 'day') {
                body.className = "bg-slate-100 text-slate-900 font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-white border-b border-slate-200 z-10 flex-shrink-0 transition-colors duration-300";
                footer.className = "p-3 bg-white border-t border-slate-200 flex-shrink-0 z-20 transition-colors duration-300";
                backBtn.className = "w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-90 transition-all";
            } else {
                body.className = "bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300";
                header.className = "flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0 transition-colors duration-300";
                footer.className = "p-3 bg-[#100407] border-t border-rose-950/60 flex-shrink-0 z-20 transition-colors duration-300";
                backBtn.className = "w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all";
            }
        }

        function tambahKeDaftarChat(owner, target) {
            let chatList = JSON.parse(localStorage.getItem(`mbd_private_chats_${owner}`) || '[]');
            if (!chatList.some(item => item.targetUser === target)) {
                chatList.push({ targetUser: target });
                localStorage.setItem(`mbd_private_chats_${owner}`, JSON.stringify(chatList));
            }
        }

        function loadPrivateMessages() {
            const roomKey = `mbd_dm_${[currentUser, targetUser].sort().join('_')}`;
            const messages = JSON.parse(localStorage.getItem(roomKey) || '[]');
            const savedTheme = localStorage.getItem('mbd_theme') || 'red';
            
            const container = document.getElementById('private-container');
            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Kirim pesan pertama untuk memulai chat pribadi dengan @${targetUser}!</div>`;
                return;
            }

            let html = "";
            messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const bubbleClass = isMe 
                    ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white rounded-tr-none shadow-lg red-glow' 
                    : (savedTheme === 'day' ? 'bg-white border border-slate-200 text-slate-900 rounded-tl-none shadow-sm' : 'bg-[#14060a] border border-rose-900/40 text-slate-200 rounded-tl-none shadow-md');

                html += `
                    <div class="flex items-start space-x-2.5 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}">
                        <div class="max-w-[78%] space-y-1">
                            <div class="p-3 rounded-2xl text-xs space-y-1.5 ${bubbleClass}">
                                <p class="leading-relaxed break-words">${escapeHtml(msg.message)}</p>
                            </div>
                            <span class="text-[8px] text-slate-500 block ${isMe ? 'text-right' : 'text-left'}">${msg.time}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function kirimPesanPrivat(e) {
            e.preventDefault();
            const input = document.getElementById('privat-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = "";
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const roomKey = `mbd_dm_${[currentUser, targetUser].sort().join('_')}`;
            let messages = JSON.parse(localStorage.getItem(roomKey) || '[]');
            
            messages.push({ sender: currentUser, message, time: timeStr });
            localStorage.setItem(roomKey, JSON.stringify(messages));

            tambahKeDaftarChat(currentUser, targetUser);
            tambahKeDaftarChat(targetUser, currentUser);

            loadPrivateMessages();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
