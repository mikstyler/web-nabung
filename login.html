<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .red-glow { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body class="bg-[#090305] text-white font-sans flex items-center justify-center h-[100dvh] p-4 relative">

    <!-- TOAST NOTIFIKASI LOGIN/REGISTER -->
    <div id="toast-notif" class="fixed top-5 left-4 right-4 z-50 hidden opacity-0 transition-opacity duration-300 pointer-events-none flex justify-center">
        <div id="toast-box" class="bg-[#14060a]/90 border border-red-500/60 text-red-300 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 backdrop-blur-xl pointer-events-auto red-glow">
            <i id="toast-icon" class="fa-solid fa-circle-info text-sm"></i>
            <span id="toast-text" class="text-xs font-bold">Notifikasi</span>
        </div>
    </div>

    <!-- CARD FORM AUTHENTICATION -->
    <div class="bg-[#14060a] border border-red-600/40 rounded-3xl p-6 w-full max-w-xs space-y-6 shadow-2xl red-glow">
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-red-600/20 border border-red-500/40 flex items-center justify-center text-red-500 text-xl mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 id="auth-title" class="text-base font-extrabold text-white">Masuk ke MBD DHO</h2>
            <p id="auth-sub" class="text-[10px] text-rose-300/70">Masukkan username dan password kamu</p>
        </div>

        <form onsubmit="prosesAuth(event)" class="space-y-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-rose-300/80">Username</label>
                <input type="text" id="auth-username" required placeholder="Ketik username..." class="w-full bg-[#090305] border border-rose-900/50 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-red-500 transition">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-rose-300/80">Password</label>
                <input type="password" id="auth-password" required placeholder="Ketik password..." class="w-full bg-[#090305] border border-rose-900/50 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-red-500 transition">
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:opacity-90 active:scale-95 text-white font-extrabold text-xs shadow-lg red-glow transition-all">
                Masuk Sekarang
            </button>
        </form>

        <div class="text-center pt-2 border-t border-rose-900/30">
            <button onclick="toggleModeAuth()" id="btn-toggle-mode" class="text-[11px] text-rose-300/80 hover:text-white font-semibold">
                Belum punya akun? <span class="text-red-400 font-bold underline">Daftar</span>
            </button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let isRegisterMode = false;

        function toggleModeAuth() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('auth-title');
            const sub = document.getElementById('auth-sub');
            const btn = document.getElementById('btn-submit');
            const toggleBtn = document.getElementById('btn-toggle-mode');

            if (isRegisterMode) {
                title.textContent = "Daftar Akun Baru";
                sub.textContent = "Buat akun MBD DHO baru kamu";
                btn.textContent = "Daftar Akun";
                toggleBtn.innerHTML = `Sudah punya akun? <span class="text-red-400 font-bold underline">Masuk</span>`;
            } else {
                title.textContent = "Masuk ke MBD DHO";
                sub.textContent = "Masukkan username dan password kamu";
                btn.textContent = "Masuk Sekarang";
                toggleBtn.innerHTML = `Belum punya akun? <span class="text-red-400 font-bold underline">Daftar</span>`;
            }
        }

        async function prosesAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!username || !password) {
                tampilkanToast("Username dan password wajib diisi!", "error");
                return;
            }

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    tampilkanToast(isRegisterMode ? "Pendaftaran berhasil! Silakan masuk." : "Login sukses! Mengalihkan...", "success");
                    if (!isRegisterMode) {
                        localStorage.setItem('mbd_logged_user', username);
                        setTimeout(() => window.location.href = 'index.html', 1200);
                    } else {
                        setTimeout(() => toggleModeAuth(), 1200);
                    }
                } else {
                    tampilkanToast(data.message || "Proses gagal, periksa data kamu.", "error");
                }
            } catch (err) {
                // Fallback jika API belum dibuat, login lokal langsung jalan
                localStorage.setItem('mbd_logged_user', username);
                tampilkanToast("Login berhasil!", "success");
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        }

        function tampilkanToast(pesan, jenis = "info") {
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');
            const toastBox = document.getElementById('toast-box');

            toastText.textContent = pesan;

            if (jenis === "success") {
                toastBox.className = "bg-[#14060a]/90 border border-emerald-500/60 text-emerald-300 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 backdrop-blur-xl pointer-events-auto shadow-emerald-900/30";
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
            } else if (jenis === "error") {
                toastBox.className = "bg-[#14060a]/90 border border-rose-500/60 text-rose-300 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 backdrop-blur-xl pointer-events-auto red-glow";
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-sm";
            } else {
                toastBox.className = "bg-[#14060a]/90 border border-red-500/60 text-red-300 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 backdrop-blur-xl pointer-events-auto red-glow";
                toastIcon.className = "fa-solid fa-circle-info text-red-400 text-sm";
            }

            const toast = document.getElementById('toast-notif');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }
    </script>
</body>
</html>
