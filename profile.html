<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Profil Saya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .red-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
        .avatar-fire-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 0 30px rgba(220, 38, 38, 0.5); }
    </style>
</head>
<body id="profile-body" class="bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300">

    <div id="toast-notif" class="fixed top-4 left-4 right-4 z-50 hidden opacity-0 transition-opacity duration-300 pointer-events-none flex justify-center">
        <div class="bg-[#14060a]/90 border border-red-500/50 text-red-300 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 backdrop-blur-xl pointer-events-auto red-glow">
            <i class="fa-solid fa-circle-check text-red-400 text-sm"></i>
            <span id="toast-msg" class="text-xs font-bold">Perubahan berhasil disimpan!</span>
        </div>
    </div>

    <header class="flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0">
        <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <h1 class="text-sm font-bold tracking-wide text-rose-100">Pengaturan Profil</h1>
        <div class="w-9"></div>
    </header>

    <main class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-5 pb-10">
        <div class="text-center space-y-3">
            <div class="w-24 h-24 rounded-full bg-black border-2 border-red-500 mx-auto overflow-hidden shadow-2xl avatar-fire-glow relative">
                <img id="main-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover">
            </div>
            <div>
                <h2 id="prof-user-display" class="text-base font-extrabold text-white">username</h2>
                <span class="text-[10px] text-red-400 font-semibold px-2.5 py-0.5 rounded-full bg-red-950/60 border border-red-600/30">Red Member</span>
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-xs font-bold text-rose-300/80">Pilih Foto Avatar</label>
            <div class="flex space-x-3 overflow-x-auto py-2 no-scrollbar px-1">
                <img onclick="pilihAvatar(this.src)" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-14 h-14 rounded-full border-2 border-transparent hover:border-red-500 cursor-pointer object-cover flex-shrink-0 active:scale-95 transition">
                <img onclick="pilihAvatar(this.src)" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" class="w-14 h-14 rounded-full border-2 border-transparent hover:border-red-500 cursor-pointer object-cover flex-shrink-0 active:scale-95 transition">
                <img onclick="pilihAvatar(this.src)" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" class="w-14 h-14 rounded-full border-2 border-transparent hover:border-red-500 cursor-pointer object-cover flex-shrink-0 active:scale-95 transition">
                <img onclick="pilihAvatar(this.src)" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" class="w-14 h-14 rounded-full border-2 border-transparent hover:border-red-500 cursor-pointer object-cover flex-shrink-0 active:scale-95 transition">
                <img onclick="pilihAvatar(this.src)" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150" class="w-14 h-14 rounded-full border-2 border-transparent hover:border-red-500 cursor-pointer object-cover flex-shrink-0 active:scale-95 transition">
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-xs font-bold text-rose-300/80">Pilih Background Banner Profil (Folder Media)</label>
            <div class="grid grid-cols-4 gap-2.5">
                <div onclick="pilihBanner('media/background1.gif')" id="banner-opt-media/background1.gif" class="h-16 rounded-xl border-2 border-red-500 overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background1.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 1</span>
                </div>
                <div onclick="pilihBanner('media/background2.gif')" id="banner-opt-media/background2.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background2.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 2</span>
                </div>
                <div onclick="pilihBanner('media/background3.gif')" id="banner-opt-media/background3.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background3.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 3</span>
                </div>
                <div onclick="pilihBanner('media/background4.gif')" id="banner-opt-media/background4.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background4.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 4</span>
                </div>
                <div onclick="pilihBanner('media/background5.gif')" id="banner-opt-media/background5.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background5.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 5</span>
                </div>
                <div onclick="pilihBanner('media/background6.gif')" id="banner-opt-media/background6.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background6.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 6</span>
                </div>
                <div onclick="pilihBanner('media/background7.gif')" id="banner-opt-media/background7.gif" class="h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition">
                    <img src="media/background7.gif" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 right-1 px-1 bg-black/70 text-[8px] font-bold text-white rounded">Bg 7</span>
                </div>
            </div>
        </div>

        <div class="space-y-3 bg-[#14060a] border border-rose-900/40 p-4 rounded-3xl">
            <h3 class="text-xs font-bold text-white tracking-wide">Pilihan Tema Aplikasi</h3>
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button onclick="gantiTema('red')" id="btn-theme-red" class="py-3 px-4 rounded-2xl bg-red-600/30 border-2 border-red-500 text-white font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition red-glow">
                    <i class="fa-solid fa-fire text-red-400"></i> Red Night
                </button>
                <button onclick="gantiTema('day')" id="btn-theme-day" class="py-3 px-4 rounded-2xl bg-[#090305] border-2 border-transparent text-slate-400 font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fa-solid fa-sun text-amber-400"></i> Light Day
                </button>
            </div>
        </div>

        <button onclick="simpanProfil()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 hover:opacity-90 active:scale-95 text-white font-extrabold text-xs shadow-xl red-glow transition-all">
            Simpan Perubahan Profil
        </button>
    </main>

    <script>
        let selectedAvatarUrl = "";
        let selectedBannerUrl = "media/background1.gif";
        let currentLoggedUser = "";

        document.addEventListener("DOMContentLoaded", () => {
            currentLoggedUser = localStorage.getItem('mbd_logged_user');
            if (!currentLoggedUser) { window.location.href = 'login.html'; return; }

            document.getElementById('prof-user-display').textContent = `@${currentLoggedUser}`;
            selectedAvatarUrl = localStorage.getItem('mbd_user_avatar_' + currentLoggedUser) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
            document.getElementById('main-avatar-preview').src = selectedAvatarUrl;

            selectedBannerUrl = localStorage.getItem('mbd_user_banner_' + currentLoggedUser) || 'media/background1.gif';
            highlightBanner(selectedBannerUrl);

            const savedTheme = localStorage.getItem('mbd_theme') || 'red';
            highlightThemeButton(savedTheme);
        });

        function pilihAvatar(url) { selectedAvatarUrl = url; document.getElementById('main-avatar-preview').src = url; }
        function pilihBanner(bannerName) { selectedBannerUrl = bannerName; highlightBanner(bannerName); }

        function highlightBanner(bannerName) {
            for (let i = 1; i <= 7; i++) {
                const pathName = `media/background${i}.gif`;
                const el = document.getElementById(`banner-opt-${pathName}`);
                if (el) {
                    if (pathName === bannerName) {
                        el.className = "h-16 rounded-xl border-2 border-red-500 overflow-hidden cursor-pointer relative active:scale-95 transition red-glow";
                    } else {
                        el.className = "h-16 rounded-xl border-2 border-transparent overflow-hidden cursor-pointer relative active:scale-95 transition opacity-60";
                    }
                }
            }
        }

        function gantiTema(mode) { localStorage.setItem('mbd_theme', mode); highlightThemeButton(mode); tampilkanToast("Tema berhasil diubah!"); }
        
        function highlightThemeButton(mode) {
            const btnRed = document.getElementById('btn-theme-red');
            const btnDay = document.getElementById('btn-theme-day');
            if (mode === 'day') {
                btnDay.className = "py-3 px-4 rounded-2xl bg-slate-200 border-2 border-slate-400 text-slate-900 font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition shadow-md";
                btnRed.className = "py-3 px-4 rounded-2xl bg-[#090305] border-2 border-transparent text-slate-400 font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition";
            } else {
                btnRed.className = "py-3 px-4 rounded-2xl bg-red-600/30 border-2 border-red-500 text-white font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition shadow-lg red-glow";
                btnDay.className = "py-3 px-4 rounded-2xl bg-[#090305] border-2 border-transparent text-slate-400 font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition";
            }
        }

        function simpanProfil() {
            localStorage.setItem('mbd_user_avatar_' + currentLoggedUser, selectedAvatarUrl);
            localStorage.setItem('mbd_user_banner_' + currentLoggedUser, selectedBannerUrl);
            tampilkanToast("Profil dan background banner berhasil disimpan!");
        }

        function tampilkanToast(pesan) {
            document.getElementById('toast-msg').textContent = pesan;
            const toast = document.getElementById('toast-notif');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 2500);
        }
    </script>
</body>
</html>
