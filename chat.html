<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBD DHO - Global Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .red-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
        .avatar-fire-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 0 30px rgba(220, 38, 38, 0.5); }
        @keyframes modalScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal { animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body id="page-body" class="bg-[#090305] text-white font-sans flex flex-col h-[100dvh] justify-between overflow-hidden relative transition-colors duration-300">

    <header id="page-header" class="flex justify-between items-center px-4 py-3 bg-[#090305] border-b border-rose-950/40 z-10 flex-shrink-0">
        <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="text-center">
            <h1 class="text-sm font-bold tracking-wide text-rose-100">Global Chat</h1>
            <p class="text-[9px] text-red-400 font-medium">● Realtime Sync Active</p>
        </div>
        <button onclick="bukaRuleModal()" class="w-9 h-9 rounded-xl bg-[#14060a] border border-rose-900/40 flex items-center justify-center text-rose-300 active:scale-90 transition-all">
            <i class="fa-solid fa-hammer text-xs text-red-400"></i>
        </button>
    </header>

    <main id="chat-container" class="flex-grow p-4 overflow-y-auto space-y-4 no-scrollbar">
        <div class="text-center py-10 text-slate-500 text-xs">Memuat obrolan global...</div>
    </main>

    <footer id="page-footer" class="p-3 bg-[#100407] border-t border-rose-950/60 flex-shrink-0 z-20">
        <form onsubmit="kirimPesan(event)" class="flex items-center space-x-2">
            <label class="w-10 h-10 rounded-2xl bg-[#090305] border border-rose-900/40 flex items-center justify-center text-rose-300 hover:text-white cursor-pointer flex-shrink-0 active:scale-95">
                <i class="fa-solid fa-image text-xs"></i>
                <input type="file" accept="image/*" onchange="previewFoto(event)" class="hidden">
            </label>
            <input type="text" id="chat-input" placeholder="Tulis pesan ke Global Chat..." class="flex-grow bg-[#090305] border border-rose-900/40 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-red-500 text-white transition">
            <button type="submit" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 flex items-center justify-center text-white active:scale-90 transition-all shadow-lg red-glow flex-shrink-0">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- MODAL PROFIL USER -->
    <div id="user-profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#14060a] border border-red-600/50 rounded-3xl w-full max-w-xs overflow-hidden shadow-2xl red-glow animate-modal">
            <div class="relative h-28 w-full bg-black">
                <img id="modal-user-banner" src="media/background1.gif" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 bg-gradient-to-t from-[#14060a] via-transparent to-transparent"></div>
            </div>
            <div class="px-6 pb-6 pt-0 text-center space-y-4 -mt-10 relative z-10">
                <div class="w-20 h-20 rounded-full bg-black border-2 border-red-500 mx-auto overflow-hidden shadow-xl avatar-fire-glow">
                    <img id="modal-user-avatar" src="" class="w-full h-full object-cover">
                </div>
                <div class="space-y-1">
                    <h3 id="modal-user-name" class="text-sm font-extrabold text-white">Username</h3>
                    <p class="text-[10px] text-red-400 font-semibold">MBD DHO Member</p>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <button onclick="tutupUserProfileModal()" class="flex-1 py-2.5 rounded-xl bg-[#090305] border border-rose-900/40 text-rose-300 active:scale-95 text-xs font-bold transition-all">Tutup</button>
                    <button onclick="bukaChatPribadiDariModal()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 text-white active:scale-95 text-xs font-bold shadow-lg red-glow transition-all">Chat Pribadi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentAvatar = "";
        let currentBanner = "";
        let selectedTargetUser = "";

        document.addEventListener("DOMContentLoaded", () => {
            currentUser = localStorage.getItem('mbd_logged_user');
            if (!currentUser) { window.location.href = 'login.html'; return; }

            currentAvatar = localStorage.getItem('mbd_user_avatar_' + currentUser) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
            currentBanner = localStorage.getItem('mbd_user_banner_' + currentUser) || 'media/background1.gif';

            loadMessages();
            setInterval(loadMessages, 3000);
        });

        async function loadMessages() {
            try {
                const res = await fetch('/api/chat');
                const data = await res.json();
                if (data.success) renderChatList(data.messages);
            } catch (err) {}
        }

        function renderChatList(messages) {
            const container = document.getElementById('chat-container');
            if (messages.length === 0) { container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Belum ada obrolan.</div>`; return; }

            let html = "";
            messages.forEach(msg => {
                const isMe = msg.username === currentUser;
                const timeStr = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const userBanner = msg.banner || 'media/background1.gif';
                const bubbleClass = isMe ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white rounded-tr-none shadow-lg red-glow' : 'bg-[#14060a] border border-rose-900/40 text-slate-200 rounded-tl-none shadow-md';

                html += `
                    <div class="flex items-start space-x-2.5 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}">
                        <img src="${msg.avatar}" onclick="bukaUserProfile('${msg.username}', '${msg.avatar}', '${userBanner}')" class="w-8 h-8 rounded-full border border-red-500/50 object-cover flex-shrink-0 mt-1 cursor-pointer hover:scale-105 transition-transform">
                        <div class="max-w-[78%] space-y-1">
                            <div class="flex items-center space-x-2 ${isMe ? 'justify-end' : ''}">
                                <span onclick="bukaUserProfile('${msg.username}', '${msg.avatar}', '${userBanner}')" class="text-[10px] font-extrabold ${isMe ? 'text-red-400' : 'text-slate-300'} cursor-pointer hover:underline">${msg.username}</span>
                                <span class="px-1.5 py-0.2 rounded bg-red-950/65 border border-red-500/30 text-[8px] font-bold text-red-300">FREE</span>
                                <span class="text-[8px] text-slate-500">${timeStr}</span>
                            </div>
                            <div class="p-3 rounded-2xl text-xs space-y-1.5 ${bubbleClass}">
                                ${msg.image ? `<img src="${msg.image}" class="rounded-xl max-h-48 w-full object-cover cursor-pointer mb-1">` : ''}
                                ${msg.message ? `<p class="leading-relaxed break-words">${escapeHtml(msg.message)}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function bukaUserProfile(username, avatar, banner) {
            if (username === currentUser) return;
            selectedTargetUser = username;
            document.getElementById('modal-user-name').textContent = username;
            document.getElementById('modal-user-avatar').src = avatar;
            document.getElementById('modal-user-banner').src = banner;
            const modal = document.getElementById('user-profile-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function tutupUserProfileModal() {
            const modal = document.getElementById('user-profile-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function bukaChatPribadiDariModal() {
            let chatList = JSON.parse(localStorage.getItem(`mbd_private_chats_${currentUser}`) || '[]');
            if (!chatList.some(item => item.targetUser === selectedTargetUser)) {
                chatList.push({ targetUser: selectedTargetUser });
                localStorage.setItem(`mbd_private_chats_${currentUser}`, JSON.stringify(chatList));
            }
            window.location.href = `privatechat.html?target=${encodeURIComponent(selectedTargetUser)}`;
        }

        async function kirimPesan(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            input.value = "";
            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, avatar: currentAvatar, banner: currentBanner, message })
                });
                loadMessages();
            } catch (err) {}
        }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
